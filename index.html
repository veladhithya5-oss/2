<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Domination</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #map-canvas:active {
            cursor: grabbing;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            pointer-events: auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .resource {
            display: flex;
            align-items: center;
            margin-right: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .resource-icon {
            margin-right: 8px;
            font-size: 20px;
        }

        .liquidity {
            color: #4ade80;
        }

        .manpower {
            color: #f87171;
        }

        .research {
            color: #60a5fa;
        }

        /* Bottom Bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            gap: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .action-btn:hover {
            background: #444;
            border-color: #777;
            transform: translateY(-2px);
        }

        .action-btn.active {
            background: #2563eb;
            border-color: #60a5fa;
        }

        .action-btn i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* Side Panel */
        .side-panel {
            position: absolute;
            right: 0;
            top: 60px;
            bottom: 80px;
            width: 300px;
            background: rgba(0, 0, 0, 0.6);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            transform: translateX(100%);
            transition: transform 0.3s;
            pointer-events: auto;
            overflow-y: auto;
        }

        .side-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .panel-content {
            font-size: 14px;
            line-height: 1.5;
        }

        /* Country Label */
        .country-label {
            position: absolute;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            text-shadow: 0 0 4px black;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            font-size: 14px;
            opacity: 0.9;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div class="loader"></div>
        <h2>Initializing World Map...</h2>
    </div>

    <div id="game-container">
        <canvas id="map-canvas"></canvas>

        <div class="ui-layer">
            <div class="top-bar">
                <div style="display:flex;">
                    <div class="resource liquidity"><span class="resource-icon">💰</span><span
                            id="res-money">100.0M</span></div>
                    <div class="resource manpower"><span class="resource-icon">👥</span><span
                            id="res-manpower">50.0K</span></div>
                    <div class="resource research"><span class="resource-icon">🔬</span><span
                            id="res-research">10.0</span></div>
                </div>
                <div id="date-display">Jan 2024</div>
            </div>

            <div class="side-panel" id="country-panel">
                <div class="panel-header" id="panel-title">Country Name</div>
                <div class="panel-content" id="panel-stats">
                    Select a country to view details.
                </div>
            </div>

            <div class="bottom-bar">
                <button class="action-btn active" id="btn-diplomacy" onclick="setMode('diplomacy')">
                    <i>🤝</i> Diplomacy
                </button>
                <button class="action-btn" id="btn-military" onclick="setMode('military')">
                    <i>⚔️</i> Military
                </button>
                <button class="action-btn" id="btn-economy" onclick="setMode('economy')">
                    <i>📈</i> Economy
                </button>
                <button class="action-btn" id="btn-research" onclick="setMode('research')">
                    <i>🧪</i> Research
                </button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>

</html>
